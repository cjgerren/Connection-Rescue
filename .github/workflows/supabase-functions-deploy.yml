name: Supabase Functions Deploy

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-functions-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mhvjottsregkwadwqwge

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Supabase CLI
        run: npm install --no-save supabase@2.95.6

      - name: Require Supabase access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: Deploy Edge Functions
        run: |
          npx supabase functions deploy verify-admin --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy manage-admins --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy send-booking-email --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy send-booking-sms --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy process-rescue-tasks --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy parse-boarding-pass --project-ref "$SUPABASE_PROJECT_REF"
